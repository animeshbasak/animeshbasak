<svg xmlns="http://www.w3.org/2000/svg" width="940" height="8" viewBox="0 0 940 8" role="presentation">
  <style>
    .pulse { animation: slide 4.5s linear infinite; }
    @keyframes slide {
      from { transform: translateX(-120px); }
      to { transform: translateX(940px); }
    }
  </style>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E63946"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="940" height="2" fill="#8B949E" opacity=".25"/>
  <g class="pulse">
    <rect y="2.5" width="120" height="3" fill="url(#p)"/>
  </g>
</svg>
